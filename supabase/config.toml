# Local Supabase CLI configuration. Cloud project refs are intentionally not stored here.
# The same auth settings are pushed to staging and production with `supabase config push`.
project_id = "nova3d-local"

[api]
enabled = true
port = 54321
# `lifecycle` holds instance_identity. It is exposed so the server can read the row with the
# service role; anon and authenticated hold no privileges on it.
# `api` is the only callable surface of the Identity and Projects tables (Story 1.3): its functions
# are executable by the service role alone. The tables live in the unexposed `identity` and
# `projects` schemas.
schemas = ["public", "graphql_public", "lifecycle", "api"]

[db]
port = 54322

[db.seed]
# Local only: inserts the `local` instance_identity row. Hosted environments insert their own
# row once at provisioning (see docs/deployment-setup.md).
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "100MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
# Exact URLs the app may be redirected to after sign-in.
additional_redirect_urls = [
  "http://127.0.0.1:3000/auth/callback",
  "http://localhost:3000/auth/callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Stays on: turning it off blocks every first-time Google sign-in. The live-Account check is the gate.
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false

# Google is the only sign-in credential: email and phone sign-up are off.
[auth.email]
enable_signup = false
enable_confirmations = false
otp_length = 6
# 15 minutes, in seconds.
otp_expiry = 900

[auth.sms]
enable_signup = false
enable_confirmations = false

[auth.sessions]
# 30-day time-box and 7-day inactivity timeout.
timebox = "720h"
inactivity_timeout = "168h"

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
# Never commit the secret. Export it before `supabase start`.
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET)"
skip_nonce_check = false

# Every other sign-in method is declared OFF on purpose (Story 1.9). `supabase config diff` only compares what this file declares, so a provider
# that is not written here could be switched on in the dashboard without anything noticing: a provider that is written here and enabled
# anywhere else is drift, and scripts/ci/check-repository.mjs fails when one is missing from this list or is anything but off.
# Email, SMS and anonymous sign-in are declared above ([auth].enable_anonymous_sign_ins, [auth.email].enable_signup, [auth.sms].enable_signup).

[auth.external.apple]
enabled = false

[auth.external.azure]
enabled = false

[auth.external.bitbucket]
enabled = false

[auth.external.discord]
enabled = false

[auth.external.facebook]
enabled = false

[auth.external.figma]
enabled = false

[auth.external.github]
enabled = false

[auth.external.gitlab]
enabled = false

[auth.external.kakao]
enabled = false

[auth.external.keycloak]
enabled = false

[auth.external.linkedin_oidc]
enabled = false

[auth.external.notion]
enabled = false

[auth.external.slack]
enabled = false

[auth.external.slack_oidc]
enabled = false

[auth.external.spotify]
enabled = false

[auth.external.twitch]
enabled = false

[auth.external.twitter]
enabled = false

[auth.external.workos]
enabled = false

[auth.external.x]
enabled = false

[auth.external.zoom]
enabled = false

[auth.web3.solana]
enabled = false

[auth.web3.ethereum]
enabled = false

# Rejects the creation of any Auth user that is not a Google identity with a verified email, so
# an Auth user can exist only through Google (Story 1.3). The function is in migration
# 20261010120100_api.sql; it never raises, and any malformed payload is rejected.
[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/api/before_user_created"
