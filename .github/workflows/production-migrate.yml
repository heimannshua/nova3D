name: Production migration

# Story 1.9. The ONLY way a migration reaches a production project, and it runs only when Josh dispatches it by hand: no push, no schedule
# and no other workflow can. It applies the migrations of the dispatched commit to the production project with the Supabase CLI and does
# nothing else (no seed, no settings push, no deployment). The production Supabase project does not exist until Story 8.7, and it receives no
# real private data before Story 8.4 passes its drill; until then this workflow stops at its first step with a clear message.
#
# The secrets come from the `production` GitHub environment, which does not exist yet either (docs/secrets.md).
on:
  workflow_dispatch:
    inputs:
      instance_id:
        description: 'The production INSTANCE_ID (the UUID of the production lifecycle.instance_identity row), typed to confirm which project this is for'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-migrate
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate the production project
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      TYPED_INSTANCE_ID: ${{ inputs.instance_id }}
    steps:
      - name: Stop unless production is provisioned and the instance ID was typed
        run: |
          if [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::The production project is not provisioned: the production environment holds no Supabase project reference, access token or database password (Story 8.7 creates the project). Nothing was changed."
            exit 1
          fi
          if ! printf '%s' "$TYPED_INSTANCE_ID" | grep -Eq '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'; then
            echo "::error::The instance ID must be the production INSTANCE_ID, a UUID. Nothing was changed."
            exit 1
          fi
          echo "Migrating the production project for instance $TYPED_INSTANCE_ID."
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - name: Link the production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: List the migrations that are pending
        run: supabase db push --linked --dry-run
      # The migrations in supabase/migrations/ at the dispatched commit, nothing else: never the seed and never roles.
      - name: Apply the migrations
        run: supabase db push --linked
