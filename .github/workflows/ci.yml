name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same ref supersedes a run that is still going.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Baseline checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - name: Install root dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck application
        run: npm run typecheck
      - name: Lint application
        run: npm run lint
      # No environment variables are set for this step on purpose: a credential-free build must succeed.
      - name: Build application (credential-free)
        run: npm run build
      - name: Check repository metadata and local links
        run: node scripts/ci/check-repository.mjs
      # Only the rendered guide is checked here. check-provisioning fails by design until Josh has
      # created each account, so it is run by hand, per story and environment.
      - name: Check the provisioning guide matches the ledger
        run: npm run render:provisioning -- --check
      - name: Test environment identity checks against fixture environments
        run: npm run test:env
      - name: Test local development origin configuration
        run: npm run test:dev-origins
      - name: Validate shell scripts
        run: |
          while IFS= read -r file; do bash -n "$file"; done < <(find tools -type f -name '*.sh' -print)
      - name: Validate Python syntax
        run: python3 -m compileall -q tools/qualification
      - name: Run credential-free recovery smoke probe
        run: |
          report="$(mktemp)"
          python3 tools/qualification/recovery/probe.py --report "$report"
          test -s "$report"
          rm -f "$report"

      # Everything below runs against the Supabase CLI stack, never a hosted project.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - name: Start the local Supabase stack and point .env.local at it
        id: stack
        run: |
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
          node scripts/setup-env.mjs local
      - name: Verify the stack's instance identity (check-env --live)
        run: npm run check:env -- --live
      - name: Unit and integration tests (Postgres tests run against the stack)
        run: npm test
      - name: Smoke test application health
        run: npm run test:health
      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e
      - name: Upload the browser report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
      - name: Stop the local Supabase stack
        if: ${{ always() && steps.stack.conclusion != 'skipped' }}
        run: supabase stop --no-backup

  optional-qualification:
    name: Optional qualification probes (blocked without local dependencies)
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Browser, CAD, print, and stack probes require heavyweight/local runtime dependencies and are run from tools/qualification.'
